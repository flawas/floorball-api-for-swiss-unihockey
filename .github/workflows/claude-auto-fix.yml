name: Claude Auto-Fix Issues

# Automatisch: Label "claude" am Issue -> alle Stufen nacheinander.
# Manuell (Actions -> Run workflow): eine einzelne Stufe für ein Issue erneut ausführen.
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue-Nummer
        required: true
      stage:
        description: Stufe (all = kompletter Ablauf)
        type: choice
        default: all
        options: [all, debugger, architect, developer, reviewer, writer]
      hint:
        description: Optionaler Zusatzhinweis für die Stufe
        required: false

concurrency:
  group: claude-auto-fix-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  meta:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'claude'))
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.m.outputs.issue }}
      stage: ${{ steps.m.outputs.stage }}
    steps:
      - id: m
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          STAGE: ${{ inputs.stage || 'all' }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "::error::ungültige Issue-Nummer"; exit 1;; esac
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

  debugger:
    needs: [meta]
    if: needs.meta.outputs.stage == 'all' || needs.meta.outputs.stage == 'debugger'
    uses: ./.github/workflows/claude-stage.yml
    secrets: inherit
    with:
      stage: debugger
      issue: ${{ needs.meta.outputs.issue }}
      hint: ${{ inputs.hint }}

  architect:
    needs: [meta, debugger]
    if: >-
      !cancelled() && needs.meta.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.outputs.status, 'abort') &&
      (needs.meta.outputs.stage == 'all' || needs.meta.outputs.stage == 'architect')
    uses: ./.github/workflows/claude-stage.yml
    secrets: inherit
    with:
      stage: architect
      issue: ${{ needs.meta.outputs.issue }}
      hint: ${{ inputs.hint }}

  developer:
    needs: [meta, debugger, architect]
    if: >-
      !cancelled() && needs.meta.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.outputs.status, 'abort') &&
      (needs.meta.outputs.stage == 'all' || needs.meta.outputs.stage == 'developer')
    uses: ./.github/workflows/claude-stage.yml
    secrets: inherit
    with:
      stage: developer
      issue: ${{ needs.meta.outputs.issue }}
      hint: ${{ inputs.hint }}

  reviewer:
    needs: [meta, debugger, architect, developer]
    if: >-
      !cancelled() && needs.meta.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.outputs.status, 'abort') &&
      (needs.meta.outputs.stage == 'all' || needs.meta.outputs.stage == 'reviewer')
    uses: ./.github/workflows/claude-stage.yml
    secrets: inherit
    with:
      stage: reviewer
      issue: ${{ needs.meta.outputs.issue }}
      hint: ${{ inputs.hint }}

  # Review-Runde 2 (nur im Gesamtablauf): developer behebt die Findings, reviewer prüft final.
  developer_fix:
    needs: [meta, debugger, architect, developer, reviewer]
    if: >-
      !cancelled() && needs.meta.outputs.stage == 'all' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.outputs.status, 'abort') &&
      needs.reviewer.outputs.status == 'changes'
    uses: ./.github/workflows/claude-stage.yml
    secrets: inherit
    with:
      stage: developer
      issue: ${{ needs.meta.outputs.issue }}
      fix: true

  reviewer_2:
    needs: [meta, debugger, architect, developer, reviewer, developer_fix]
    if: >-
      !cancelled() && needs.meta.outputs.stage == 'all' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.outputs.status, 'abort') &&
      needs.developer_fix.outputs.status == 'ok'
    uses: ./.github/workflows/claude-stage.yml
    secrets: inherit
    with:
      stage: reviewer
      issue: ${{ needs.meta.outputs.issue }}
      final: true

  writer:
    needs: [meta, debugger, architect, developer, reviewer, developer_fix, reviewer_2]
    if: >-
      !cancelled() && needs.meta.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.outputs.status, 'abort') &&
      (needs.meta.outputs.stage == 'writer' ||
       (needs.meta.outputs.stage == 'all' &&
        (needs.reviewer.outputs.status == 'ok' || needs.reviewer_2.outputs.status == 'ok')))
    uses: ./.github/workflows/claude-stage.yml
    secrets: inherit
    with:
      stage: writer
      issue: ${{ needs.meta.outputs.issue }}
      hint: ${{ inputs.hint }}

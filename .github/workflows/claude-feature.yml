name: Claude Feature Requests

# Automatisch: Label "claude-feature" am Issue -> alle Stufen nacheinander.
# Manuell (Actions -> Run workflow) oder per Issue-Kommentar "/claude ..." (siehe claude-comment.yml):
#   stage = all | from-<stufe> (ab dieser Stufe weiter) | <stufe> (nur diese Stufe)
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue-Nummer
        required: true
      stage:
        description: Stufe (all = kompletter Ablauf, from-x = ab Stufe x, x = nur Stufe x)
        type: choice
        default: all
        options: [all, from-architect, from-developer, from-reviewer, from-writer, architect, developer, reviewer, writer]
      fix:
        description: developer-Stufe im Fix-Modus (Review-Findings/Kommentare am PR beheben)
        type: boolean
        default: false
      hint:
        description: Optionaler Zusatzhinweis für die Stufe
        required: false

# eine Gruppe pro Issue, geteilt mit den anderen Claude-Workflows: es läuft nur ein Lauf gleichzeitig
concurrency:
  group: claude-auto-fix-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  meta:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'claude-feature') ||
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'claude-feature'))
    runs-on: ubuntu-24.04
    outputs:
      issue: ${{ steps.m.outputs.issue }}
      stage: ${{ steps.m.outputs.stage }}
      run_debugger: ${{ steps.m.outputs.run_debugger }}
      run_architect: ${{ steps.m.outputs.run_architect }}
      run_developer: ${{ steps.m.outputs.run_developer }}
      run_reviewer: ${{ steps.m.outputs.run_reviewer }}
      run_writer: ${{ steps.m.outputs.run_writer }}
      run_loop: ${{ steps.m.outputs.run_loop }}
    steps:
      - id: m
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          STAGE: ${{ inputs.stage || 'all' }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "::error::ungültige Issue-Nummer"; exit 1;; esac
          idx() { case "$1" in debugger) echo 1;; architect) echo 2;; developer) echo 3;; reviewer) echo 4;; writer) echo 5;; *) echo 0;; esac; }
          case "$STAGE" in
            all)    START=1; END=5; LOOP=true ;;
            from-*) START=$(idx "${STAGE#from-}"); END=5; LOOP=true ;;
            *)      START=$(idx "$STAGE"); END=$START; LOOP=false ;;
          esac
          [ "$START" -gt 0 ] || { echo "::error::unbekannte Stufe $STAGE"; exit 1; }
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "run_loop=$LOOP" >> "$GITHUB_OUTPUT"
          for S in debugger architect developer reviewer writer; do
            I=$(idx "$S")
            if [ "$I" -ge "$START" ] && [ "$I" -le "$END" ]; then V=true; else V=false; fi
            echo "run_$S=$V" >> "$GITHUB_OUTPUT"
          done

  runner:
    needs: [meta]
    if: needs.meta.result == 'success'
    uses: ./.github/workflows/claude-pick-runner.yml
    secrets: inherit

  architect:
    needs: [meta]
    if: >-
      !cancelled() && needs.meta.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.outputs.status, 'abort') &&
      needs.meta.outputs.run_architect == 'true'
    uses: ./.github/workflows/claude-stage.yml
    secrets: inherit
    with:
      stage: architect
      kind: feature
      issue: ${{ needs.meta.outputs.issue }}
      hint: ${{ inputs.hint }}

  developer:
    needs: [meta, architect, runner]
    if: >-
      !cancelled() && needs.meta.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.outputs.status, 'abort') &&
      needs.meta.outputs.run_developer == 'true'
    uses: ./.github/workflows/claude-stage.yml
    secrets: inherit
    with:
      stage: developer
      runner: ${{ needs.runner.outputs.heavy || '"ubuntu-24.04"' }}
      kind: feature
      issue: ${{ needs.meta.outputs.issue }}
      hint: ${{ inputs.hint }}
      fix: ${{ inputs.fix == true }}

  reviewer:
    needs: [meta, architect, developer, runner]
    if: >-
      !cancelled() && needs.meta.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.outputs.status, 'abort') &&
      needs.meta.outputs.run_reviewer == 'true'
    uses: ./.github/workflows/claude-stage.yml
    secrets: inherit
    with:
      stage: reviewer
      runner: ${{ needs.runner.outputs.heavy || '"ubuntu-24.04"' }}
      kind: feature
      issue: ${{ needs.meta.outputs.issue }}
      hint: ${{ inputs.hint }}

  developer_fix:
    needs: [meta, architect, developer, reviewer, runner]
    if: >-
      !cancelled() && needs.meta.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.outputs.status, 'abort') &&
      needs.meta.outputs.run_loop == 'true' && needs.reviewer.outputs.status == 'changes'
    uses: ./.github/workflows/claude-stage.yml
    secrets: inherit
    with:
      stage: developer
      runner: ${{ needs.runner.outputs.heavy || '"ubuntu-24.04"' }}
      kind: feature
      issue: ${{ needs.meta.outputs.issue }}
      fix: true

  reviewer_2:
    needs: [meta, architect, developer, reviewer, developer_fix, runner]
    if: >-
      !cancelled() && needs.meta.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.outputs.status, 'abort') &&
      needs.meta.outputs.run_loop == 'true' && needs.developer_fix.outputs.status == 'ok'
    uses: ./.github/workflows/claude-stage.yml
    secrets: inherit
    with:
      stage: reviewer
      runner: ${{ needs.runner.outputs.heavy || '"ubuntu-24.04"' }}
      kind: feature
      issue: ${{ needs.meta.outputs.issue }}
      final: true

  writer:
    needs: [meta, architect, developer, reviewer, developer_fix, reviewer_2]
    if: >-
      !cancelled() && needs.meta.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.outputs.status, 'abort') &&
      needs.meta.outputs.run_writer == 'true' &&
      (needs.meta.outputs.run_reviewer == 'false' ||
       needs.reviewer.outputs.status == 'ok' || needs.reviewer_2.outputs.status == 'ok')
    uses: ./.github/workflows/claude-stage.yml
    secrets: inherit
    with:
      stage: writer
      kind: feature
      issue: ${{ needs.meta.outputs.issue }}
      hint: ${{ inputs.hint }}

  # Bei einem Abbruch löst der Agent wp-unblocker den Lauf auf (Entscheidung, Aufteilung oder Eskalation).
  unblock:
    needs: [meta, architect, developer, reviewer, developer_fix, reviewer_2, writer]
    if: always() && contains(needs.*.outputs.status, 'abort')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh workflow run claude-unblock.yml --ref "${{ github.event.repository.default_branch }}" -f issue_number="${{ needs.meta.outputs.issue }}"
